<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; form-action https://formspree.io; base-uri 'self'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Contact – Portfolio de Maxence Français</title>
    <meta name="description" content="Contacter Maxence Français, étudiant en Master 2 Cybersécurité, pour une proposition de stage.">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <a class="visually-hidden-focusable skip-link" href="#contenu">Aller au contenu</a>
    <header data-partial="partials/navbar.html"></header>

    <main id="contenu" class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <h1 class="mb-3">Contact</h1>
                <p class="lead">
                    Une proposition de stage ou une question sur mon parcours ? Écrivez-moi avec le formulaire ci-dessous
                    ou sur LinkedIn, je réponds rapidement.
                </p>

                <div class="d-flex flex-wrap gap-2 mb-4">
                    <a class="btn btn-outline-primary" href="https://www.linkedin.com/in/maxence-fran%C3%A7ais-a039a2307/" target="_blank" rel="noopener noreferrer">
                        <i class="fa-brands fa-linkedin" aria-hidden="true"></i> LinkedIn
                    </a>
                    <a class="btn btn-outline-primary" href="https://github.com/MiscuitAtlas" target="_blank" rel="noopener noreferrer">
                        <i class="fa-brands fa-github" aria-hidden="true"></i> GitHub
                    </a>
                    <a class="btn btn-outline-primary" href="assets/docs/CV_Maxence_Francais.pdf" download="CV_Maxence_Francais.pdf">
                        <i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i> CV (PDF)
                    </a>
                </div>

                <section class="card shadow-sm" aria-labelledby="titre-formulaire">
                    <div class="card-body p-4">
                        <h2 id="titre-formulaire" class="h4 mb-3">Formulaire de contact</h2>
                        <form action="https://formspree.io/f/mvgzabrl" method="POST">
                            <div class="mb-3">
                                <label for="name" class="form-label">Nom</label>
                                <input type="text" class="form-control" id="name" name="name" autocomplete="name" maxlength="100" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Adresse e-mail</label>
                                <input type="email" class="form-control" id="email" name="email" autocomplete="email" maxlength="150" required>
                            </div>
                            <div class="mb-3">
                                <label for="subject" class="form-label">Sujet</label>
                                <input type="text" class="form-control" id="subject" name="subject" maxlength="150" required>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" name="message" rows="6" maxlength="5000" required></textarea>
                            </div>
                            <!-- Champ piège anti-spam : invisible pour les humains, rempli par les robots (géré par Formspree) -->
                            <div class="d-none" aria-hidden="true">
                                <label for="gotcha">Ne pas remplir</label>
                                <input type="text" id="gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Envoyer
                            </button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div data-partial="partials/footer.html"></div>
</body>
</html>
